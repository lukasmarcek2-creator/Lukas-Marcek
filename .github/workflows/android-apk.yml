name: Android APK – Čítačka dokumentov

on:
  push:
    paths:
      - "dokument-citac/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dokument-citac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build web app
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp src/icon-192.png $d/ic_launcher.png
            cp src/icon-192.png $d/ic_launcher_round.png
          done

      - name: Build APK
        working-directory: dokument-citac/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../citacka-dokumentov.apk

      - uses: actions/upload-artifact@v4
        with:
          name: citacka-dokumentov-apk
          path: dokument-citac/citacka-dokumentov.apk

      - name: Publish release for easy phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: citacka-v1.0.${{ github.run_number }}
          name: Čítačka dokumentov 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dokument-citac/citacka-dokumentov.apk
          body: |
            Android aplikácia Čítačka dokumentov (PDF, Word, Excel, PowerPoint, text, obrázky). Funguje offline.
            Stiahni súbor citacka-dokumentov.apk v telefóne a nainštaluj ho (povoľ inštaláciu z neznámych zdrojov).
