name: Deploy All Document Reader (GitHub Pages)

# Zverejní priečinok all-document-reader/ do vetvy gh-pages,
# z ktorej GitHub Pages servíruje aplikáciu cez HTTPS.
on:
  push:
    branches: [main]
    paths: ['all-document-reader/**', '.github/workflows/deploy-document-reader.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to gh-pages
        run: |
          site="$(mktemp -d)"
          cp -r all-document-reader/. "$site"/
          touch "$site/.nojekyll"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy All Document Reader from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
